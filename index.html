<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physarum Pathfinder</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #fafafa;
        color: #111;
      }
      canvas {
        display: block;
        border: 1px solid #ddd;
        position: relative;
      }
      .canvas-wrap {
        background: #fafafa;
      }
      #controls {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      #controls label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      #controls input[type="range"] {
        width: 160px;
      }
      button {
        padding: 6px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      #hint {
        margin-top: 8px;
        font-size: 13px;
        color: #555;
      }
      #stats {
        margin-top: 4px;
        font-size: 12px;
        color: #888;
        font-variant-numeric: tabular-nums;
      }
      .canvas-wrap {
        position: relative;
        display: inline-block;
      }
      #map {
        position: absolute;
        inset: 0;
        width: 900px;
        height: 600px;
        pointer-events: none;
        object-fit: cover;
        opacity: 0.5;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="canvas-wrap">
      <img id="map" alt="" />
      <canvas id="c" width="900" height="600"></canvas>
    </div>
    <div id="controls">
      <button id="run">Run</button>
      <button id="reset">Reset</button>
      <label>μ:  <input type="range" id="mu" min="0.5" max="2"   step="0.05" value="1.2"></label>
      <label>Δt: <input type="range" id="dt" min="0.01" max="0.2" step="0.01" value="0.05"></label>
      <label>Mode:
        <select id="mode">
          <option value="complete">Complete</option>
          <option value="delaunay">Delaunay</option>
        </select>
      </label>
      <label>Map: <input type="file" id="mapfile" accept="image/*"></label>
      <button id="clearmap" type="button">Clear map</button>
    </div>
    <p id="hint">Click to place node · Shift+click = source · Alt+click = sink</p>
    <p id="stats">0 nodes · 0 edges · 0 fps</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
